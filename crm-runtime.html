<style id="nvt-mobile-auth-runtime-override">

#loginScreen:not(.is-hidden) .login-intro,#loginScreen:not(.is-hidden) .login-intro *{display:none!important}
#loginScreen:not(.is-hidden) .form-side,#loginScreen:not(.is-hidden) .nvt-auth-wrapper{display:flex!important;visibility:visible!important;opacity:1!important;position:relative!important;z-index:20!important;width:100%!important;min-height:100dvh!important;height:auto!important;padding:14px 12px 24px!important;box-sizing:border-box!important;align-items:center!important;justify-content:center!important}
#loginScreen:not(.is-hidden) .form-side-aura,#loginScreen:not(.is-hidden) .nvt-auth-aura{display:block!important;visibility:visible!important;opacity:1!important;position:absolute!important;inset:0!important;z-index:0!important;pointer-events:none!important}
#loginScreen:not(.is-hidden) .auth-center-card,#loginScreen:not(.is-hidden) .nvt-auth-card{display:block!important;visibility:visible!important;opacity:1!important;position:relative!important;z-index:30!important;width:min(100%,356px)!important;max-width:356px!important;min-height:0!important;margin:0 auto!important;padding:20px 16px 18px!important;border-radius:20px!important;box-sizing:border-box!important;background:#fff!important;color:#0f172a!important;border-radius:24px!important;box-shadow:0 16px 36px -10px rgba(15,23,42,.16),0 0 0 1px rgba(15,23,42,.06)!important}
#loginScreen:not(.is-hidden) .nvt-auth-hero,#loginScreen:not(.is-hidden) #loginForm:not(.is-hidden),#loginScreen:not(.is-hidden) #registerForm:not(.is-hidden){display:flex!important;visibility:visible!important;opacity:1!important}
#loginScreen:not(.is-hidden) .nvt-auth-hero{flex-direction:column!important;width:100%!important}
#loginScreen:not(.is-hidden) #loginForm:not(.is-hidden),#loginScreen:not(.is-hidden) #registerForm:not(.is-hidden){flex-direction:column!important;width:100%!important;height:auto!important;overflow:visible!important;border:none!important;background:transparent!important;padding:0!important;margin:0!important;box-shadow:none!important}
#loginScreen:not(.is-hidden) #loginForm label,#loginScreen:not(.is-hidden) #registerForm label{text-transform:none!important}
#loginScreen:not(.is-hidden) .nvt-input-label{text-transform:uppercase!important}
#loginScreen:not(.is-hidden) .nvt-auth-row-meta,#loginScreen:not(.is-hidden) .row-remember-forgot{display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;width:100%!important;margin:8px 0 4px!important}
#loginScreen:not(.is-hidden) .nvt-remember-wrap,#loginScreen:not(.is-hidden) .remember-label{display:inline-flex!important;flex-direction:row!important;align-items:center!important;gap:7px!important;cursor:pointer!important;white-space:nowrap!important;color:#64748b!important;font-size:12px!important;font-weight:600!important}
#loginScreen:not(.is-hidden) .nvt-remember-wrap input,#loginScreen:not(.is-hidden) .remember-label input{width:16px!important;height:16px!important;min-height:16px!important;flex:0 0 16px!important;margin:0!important;accent-color:#ea580c!important}
#loginScreen:not(.is-hidden) .nvt-forgot-link,#loginScreen:not(.is-hidden) .forgot-link{border:none!important;background:transparent!important;padding:0!important;color:#ea580c!important;font-size:12px!important;font-weight:700!important;cursor:pointer!important;outline:none!important;box-shadow:none!important;text-decoration:none!important;display:inline-block!important}
#loginScreen:not(.is-hidden) .nvt-auth-switch-link,#loginScreen:not(.is-hidden) .switch-auth-link{border:none!important;background:transparent!important;padding:0!important;margin-left:4px!important;color:#ea580c!important;font-size:12px!important;font-weight:800!important;cursor:pointer!important;outline:none!important;box-shadow:none!important;text-decoration:none!important;display:inline-block!important}
#loginScreen:not(.is-hidden) #loginForm:not(.is-hidden) .nvt-form-group,#loginScreen:not(.is-hidden) #registerForm:not(.is-hidden) .nvt-form-group{display:flex!important;flex-direction:column!important;visibility:visible!important;opacity:1!important;width:100%!important}
#loginScreen:not(.is-hidden) .nvt-input-box,#loginScreen:not(.is-hidden) .nvt-input-native,#loginScreen:not(.is-hidden) .nvt-btn-submit,#loginScreen:not(.is-hidden) .nvt-auth-footer,#loginScreen:not(.is-hidden) .nvt-auth-row-meta{visibility:visible!important;opacity:1!important}
#loginScreen:not(.is-hidden) .nvt-input-box{display:flex!important;min-height:44px!important}
#loginScreen:not(.is-hidden) .nvt-input-native{display:block!important;min-width:0!important}
#loginScreen:not(.is-hidden) .nvt-btn-submit{display:flex!important;min-height:44px!important}

<body>
  <section id="loginScreen" class="login-screen desktop-login-layout nvt-auth-current" data-auth-ui="current">
    <!-- Banner tảng băng bên trái theo mẫu desktop. -->
    <div class="banner-side login-intro">
      <img class="banner-img-bg login-intro-img" src="./login-background.jpg" alt="NVT AGENCY">
      <div class="banner-overlay" aria-hidden="true"></div>
    </div>

    <!-- Form xác thực bên phải: giữ class cũ để mobile và JS hiện tại tiếp tục hoạt động. -->
    <div class="form-side login-panel nvt-auth-wrapper">
      <div class="form-side-aura nvt-auth-aura" aria-hidden="true"></div>
      <div class="auth-center-card login-card nvt-auth-card">
        <div class="auth-segmented-tabs nvt-auth-tabs" role="tablist" aria-label="Xác thực tài khoản">
          <button type="button" id="loginTab" class="auth-tab-item nvt-auth-tab-btn active" role="tab" aria-selected="true" data-switch-auth="login">ĐĂNG NHẬP</button>
          <button type="button" id="registerTab" class="auth-tab-item nvt-auth-tab-btn" role="tab" aria-selected="false" data-switch-auth="register">ĐĂNG KÝ</button>
        </div>

        <div class="brand-block nvt-auth-hero">
          <h1 class="brand-heading nvt-auth-brand-name">NVT AGENCY</h1>
          <div class="brand-sub-slogan nvt-auth-slogan">ACADEMY · AFFILIATE · EDUCATION</div>
          <h2 id="authViewTitle" class="form-hero-title">ĐĂNG NHẬP NVT AGENCY</h2>
          <p id="authDescription" class="form-hero-desc nvt-auth-view-desc">ĐĂNG NHẬP ĐỂ TRUY CẬP HỆ THỐNG NỘI BỘ.</p>
        </div>

        <form id="loginForm" novalidate>
          <div class="form-field-group nvt-form-group">
            <label for="loginPhone" class="field-label nvt-input-label">SỐ ĐIỆN THOẠI HOẶC EMAIL</label>
            <div class="field-input-box nvt-input-box"><svg class="field-icon nvt-input-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg><input type="text" id="loginPhone" name="loginPhone" class="field-native-input nvt-input-native" placeholder="Nhập số điện thoại hoặc email..." required autocomplete="username"></div>
          </div>
          <div class="form-field-group nvt-form-group">
            <label for="loginPassword" class="field-label nvt-input-label">MẬT KHẨU</label>
            <div class="field-input-box nvt-input-box"><svg class="field-icon nvt-input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg><input type="password" id="loginPassword" name="loginPassword" class="field-native-input nvt-input-native" placeholder="Nhập mật khẩu" required autocomplete="current-password"><button type="button" class="eye-toggle-button nvt-eye-toggle" data-toggle-password="loginPassword" aria-label="Hiện mật khẩu" title="Hiện mật khẩu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div>
          </div>
          <label id="loginOtpField" class="form-field full is-hidden">MÃ XÁC THỰC 2FA<input id="loginOtp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Nhập mã 6 chữ số"></label>
          <div class="row-remember-forgot nvt-auth-row-meta">
            <label class="remember-label nvt-remember-wrap"><input id="rememberMe" name="rememberMe" type="checkbox"> <span>Ghi nhớ</span></label>
            <button id="forgotPasswordButton" class="forgot-link nvt-forgot-link" type="button">Quên mật khẩu?</button>
          </div>
          <div id="loginError" class="form-error nvt-auth-error-msg" role="alert"></div>
          <button type="submit" id="loginSubmitBtn" class="btn-auth-submit nvt-btn-submit"><span>ĐĂNG NHẬP</span><svg class="btn-arrow-icon nvt-btn-arrow" viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg></button>
          <div class="form-footer-switch nvt-auth-footer"><span>Chưa có tài khoản?</span> <button type="button" class="switch-auth-link nvt-auth-switch-link" data-switch-auth="register">Đăng ký</button></div>
        </form>

        <form id="registerForm" class="is-hidden" hidden style="display:none!important" aria-hidden="true" novalidate>
          <div class="form-field-group nvt-form-group"><label for="registerName" class="field-label nvt-input-label">HỌ VÀ TÊN</label><div class="field-input-box nvt-input-box"><svg class="field-icon nvt-input-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><input type="text" id="registerName" name="registerName" class="field-native-input nvt-input-native" placeholder="Nhập họ và tên" required autocomplete="name"></div></div>
          <div class="form-field-group nvt-form-group"><label for="registerAccountId" class="field-label nvt-input-label">ID TÀI KHOẢN SALE</label><div class="field-input-box nvt-input-box"><svg class="field-icon nvt-input-icon" viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg><input type="text" id="registerAccountId" name="registerAccountId" class="field-native-input nvt-input-native" placeholder="Nhập ID tài khoản SALE" required autocomplete="off"></div></div>
          <div class="form-field-group nvt-form-group"><label for="registerPhone" class="field-label nvt-input-label">SỐ ĐIỆN THOẠI</label><div class="field-input-box nvt-input-box"><svg class="field-icon nvt-input-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg><input type="tel" id="registerPhone" name="registerPhone" class="field-native-input nvt-input-native" placeholder="Nhập số điện thoại" required autocomplete="tel"></div></div>
          <div class="form-field-group nvt-form-group"><label for="registerEmail" class="field-label nvt-input-label">EMAIL</label><div class="field-input-box nvt-input-box"><svg class="field-icon nvt-input-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg><input type="email" id="registerEmail" name="registerEmail" class="field-native-input nvt-input-native" placeholder="Nhập Gmail" required autocomplete="email"></div></div>
          <div class="form-field-group nvt-form-group"><label for="registerPassword" class="field-label nvt-input-label">MẬT KHẨU</label><div class="field-input-box nvt-input-box"><svg class="field-icon nvt-input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg><input type="password" id="registerPassword" name="registerPassword" class="field-native-input nvt-input-native" placeholder="Tối thiểu 8 ký tự" required autocomplete="new-password"><button type="button" class="eye-toggle-button nvt-eye-toggle" data-toggle-password="registerPassword" aria-label="Hiện mật khẩu" title="Hiện mật khẩu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div></div>
          <div class="form-field-group nvt-form-group"><label for="registerPasswordConfirm" class="field-label nvt-input-label">NHẬP LẠI MẬT KHẨU</label><div class="field-input-box nvt-input-box"><svg class="field-icon nvt-input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg><input type="password" id="registerPasswordConfirm" name="registerPasswordConfirm" class="field-native-input nvt-input-native" placeholder="Xác nhận lại mật khẩu" required autocomplete="new-password"><button type="button" class="eye-toggle-button nvt-eye-toggle" data-toggle-password="registerPasswordConfirm" aria-label="Hiện mật khẩu" title="Hiện mật khẩu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div></div>
          <div id="registerMessage" class="form-message nvt-auth-error-msg" role="status"></div>
          <button type="submit" id="registerSubmitBtn" class="btn-auth-submit nvt-btn-submit"><span>ĐĂNG KÝ TÀI KHOẢN</span><svg class="btn-arrow-icon nvt-btn-arrow" viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg></button>
          <div class="form-footer-switch nvt-auth-footer"><span>Đã có tài khoản?</span> <button type="button" class="switch-auth-link nvt-auth-switch-link" data-switch-auth="login">Đăng nhập</button></div>
        </form>
      </div>
    </div>
  </section>  <div id="appShell" class="app-shell is-hidden">
    <aside id="sidebar" class="sidebar">
      <a class="brand brand-light brand-area sidebar-brand" href="#" data-view-link="dashboard">
        <div class="brand-logo brand-logo-sq nvt-avatar-fallback" role="img" aria-label="NVT AGENCY">NVT</div>
        <span class="brand-copy"><strong>NVT AGENCY</strong><small>AGENCY OPERATING SYSTEM</small></span>
      </a>
      <nav id="sideNav" class="side-nav nav-menu sidebar-nav" aria-label="Điều hướng chính"></nav>
      <div class="sidebar-foot sidebar-footer user-meta-footer">
        <span id="sidebarScope" class="scope-chip">ALL</span>
        <div><b id="sidebarRole">ADMIN</b><small>Phiên riêng biệt</small></div>
      </div>
    </aside>

    <main class="main main-wrapper main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button id="menuButton" class="icon-button mobile-only mobile-nav-btn" type="button" aria-label="Mở menu">☰</button>
          <div class="breadcrumb"><span>NVT AGENCY</span><b id="breadcrumb">Tổng quan</b></div>
          <label class="global-search top-search-wrap search-wrap"><span class="search-icon">⌕</span><input id="globalSearch" type="search" placeholder="Tìm khách hàng, đơn hàng, sản phẩm..."></label>
        </div>
        <div class="topbar-actions topbar-right">
          <button id="themeButton" class="icon-button" type="button" aria-label="Đổi giao diện">◐</button>
          <button id="notificationButton" class="icon-button notification-button" type="button" aria-label="Thông báo">●<i id="notificationCount">0</i></button>
          <div class="profile user-pill"><span id="profileAvatar" class="avatar user-avatar-initials nvt-avatar-fallback" role="img" aria-label="Avatar NVT">NVT</span><span class="user-details"><b id="profileName">Start</b><small id="profileRole">ADMIN · ALL</small></span></div>
          <button id="logoutButton" class="button button-quiet" type="button">Đăng xuất</button>
        </div>
      </header>
      <div id="mobileNavWrap" class="mobile-nav-wrap"><select id="mobileNav" aria-label="Chọn màn hình"></select></div>
      <section id="content" class="content content-body" aria-live="polite"></section>
    </main>
  </div>

  <div id="drawerRoot"></div>
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
