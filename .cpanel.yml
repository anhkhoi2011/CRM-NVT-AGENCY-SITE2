---
deployment:
  tasks:
    - export PUBLICPATH="$HOME/public_html/"
    - export CRMPATH="$HOME/crm/"
    - /bin/mkdir -p "$PUBLICPATH" "$CRMPATH" "$CRMPATH/tmp" "$CRMPATH/tools"
    - /bin/cp -R index.html crm-runtime.html crm-runtime-api.js reference-view.js reference-crm.js marketing-hub.js crm-notifications.js crm-mobile.js crm-mobile.css accounting-detail.js order-payments.js customer-save-queue.js support-chat-widget.js crm.js crm.css crm-modern.css crm-boot.css nvt-mobile-auth.css care-ui.js hr-profiles.js logo.jpg login-background.jpg customer-journey.svg team-tree-hierarchy.css team-hierarchy-tree.svg commission_tree_demo.html commission-apex-mindmap.svg assets $PUBLICPATH
    - /bin/cp -R index.html crm-runtime.html crm-runtime-api.js reference-view.js reference-crm.js marketing-hub.js crm-notifications.js crm-mobile.js crm-mobile.css accounting-detail.js order-payments.js customer-save-queue.js support-chat-widget.js crm.js crm.css crm-modern.css crm-boot.css nvt-mobile-auth.css care-ui.js hr-profiles.js logo.jpg login-background.jpg customer-journey.svg team-tree-hierarchy.css team-hierarchy-tree.svg commission_tree_demo.html commission-apex-mindmap.svg assets marketing-export.cjs ai-provider.cjs ai-analysis.cjs webhook-server.cjs webhook-store.cjs blacklist.cjs webhook-journal.cjs runtime-storage.cjs telegram-bot.cjs telegram-worker.cjs telegram-worker-supervisor.cjs watchdog.cjs support-chat.cjs crm-data.cjs order-audit.cjs distribution-rounds.js crm-defaults.json product-catalog.json system-accounts.cjs system-accounts.json reference-layout.json db.js managed-pool.cjs password-service.cjs password-worker.cjs process-safety.cjs app.js package.json package-lock.json database $CRMPATH
    - /bin/cp tools/verify-sql.cjs tools/diagnose-webhook.cjs "$CRMPATH/tools/"
    - . "$HOME/nodevenv/crm/18/bin/activate" && cd "$CRMPATH" && npm ci --omit=dev && /bin/touch "$CRMPATH/tmp/restart.txt"

